name: Biblioteca e sito
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: biblioteca-pubblicazione
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.html
            /*.js
            /*.css
            /.nojekyll
            /manifest.json
            /tools/
            /biblioteca/
            /biblioteca-input/
            /biblioteca-stato/
            /eink/catalog.tsv
      - name: Use the latest catalogue
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=12.0,<13'
      - name: Check importer and catalogue preservation
        run: python -m unittest discover -s tools -p test_biblioteca.py -v
      - name: Prepare TXT books
        run: python tools/import_books.py --repo .
      - name: Publish completed books and receipts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -s biblioteca-generated-files.txt ]; then
            git add --sparse --pathspec-from-file=biblioteca-generated-files.txt
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare uploaded TXT books for the e-ink reader'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build the mobile site
        run: python tools/build_pages.py --repo . --output _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
