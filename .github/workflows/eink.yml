name: Prepare e-ink manga
on:
  workflow_dispatch:
    inputs:
      manga:
        description: Manga ID (empty for all)
        required: false
      chapter:
        description: Chapter ID (empty for all chapters)
        required: false
permissions:
  contents: write
concurrency:
  group: eink-assets
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=12.0,<13'
      - name: Convert long images
        env:
          MANGA_ID: ${{ inputs.manga }}
          CHAPTER_ID: ${{ inputs.chapter }}
        shell: bash
        run: |
          args=(--repo . --output eink --cache /tmp/eink-originals --workers 3)
          if [ -n "$MANGA_ID" ]; then args+=(--manga "$MANGA_ID"); else args+=(--all); fi
          if [ -n "$CHAPTER_ID" ]; then args+=(--chapter "$CHAPTER_ID"); fi
          python tools/build_eink.py "${args[@]}"
      - name: Publish prepared files in the repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eink
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare manga chapters for e-ink reader'
            git push
          fi
